[workspace]
authors = ["FreekPols <c.f.j.pols@tudelft.nl>"]
channels = ["conda-forge"]
name = "gitintro"
platforms = ["linux-64", "osx-64", "win-64"]
version = "0.1.0"

[tasks]
editor = "jupyter lab"
preview = "myst start"
push = { cmd = 'git add . && git commit -m "{{ message }}" && git push', args = ["message"] }
pull = 'git pull'

[dependencies]
mystmd = ">=1.10.1,<2"
jupyterlab = ">=4.6.3,<5"
